<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MAGIC Foods UAE - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="./assets/magic/magic_logo_transparent.png">
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      var pathSegmentsToKeep = 1; // For project pages (e.g. /Magic-DEMO/)

      var l = window.location;
      // If we are in local dev or root, keep 0 segments, otherwise keep 1
      var isProjectPage = l.pathname.indexOf('/Magic-DEMO') === 0;
      var keep = isProjectPage ? 1 : 0;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + keep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
